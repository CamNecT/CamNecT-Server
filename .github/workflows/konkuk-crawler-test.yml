name: Konkuk crawler checks
on:
  pull_request:
    paths:
      - 'crawlers/konkuk-job/**'
      - '.github/workflows/konkuk-crawler-test.yml'
  push:
    branches: [main, develop]
    paths:
      - 'crawlers/konkuk-job/**'
      - '.github/workflows/konkuk-crawler-test.yml'
permissions:
  contents: read
jobs:
  crawler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawlers/konkuk-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: crawlers/konkuk-job/src/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: cfn-lint template.yaml notifications.yaml

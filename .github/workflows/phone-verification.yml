name: Phone verification tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phone-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: phone_integration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PHONE_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/phone_integration_test?allowPublicKeyRetrieval=true&useSSL=false
      PHONE_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:3306/phone_migration_test?allowPublicKeyRetrieval=true&useSSL=false
      PHONE_MYSQL_USERNAME: root
      PHONE_MYSQL_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare separate migration database
        # Historical V1 compares explicitly unicode_ci tables with the database's default tables.
        run: |
          docker exec -e MYSQL_PWD="$PHONE_MYSQL_PASSWORD" ${{ job.services.mysql.id }} mysql -uroot -e 'ALTER DATABASE phone_integration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE phone_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Test application, real MySQL transactions, migrations and deployment checks
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-verification-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to EC2 after publishing
        type: boolean
        required: true
        default: true
      preview:
        description: Test and build only (skip image publication and EC2)
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.preview && format('preview-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
          python3 -m unittest discover -s .github/deploy -p 'test_*.py'
          python3 -m unittest discover -s tag-suggestions

  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ !inputs.preview }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          # Staging by digest keeps release tags unchanged until the tests pass.
          outputs: >-
            ${{ inputs.preview && 'type=cacheonly' ||
                format('type=image,name={0}/camnect-server,push-by-digest=true,name-canonical=true,push=true', secrets.DOCKER_USERNAME) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, build]
    if: ${{ !inputs.preview }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/camnect-server
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish tested image
        run: docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: Upload production Compose and deployment check to EC2
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "docker-compose.prod.yml,.github/deploy/check-phone-deployment.py,tag-suggestions/worker.py"
          target: "/home/${{ secrets.USERNAME }}/camnect-project/"
          overwrite: true
      - name: Deploy to EC2
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          CAMNECT_SERVER_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
        with:
          envs: CAMNECT_SERVER_IMAGE
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd /home/${{ secrets.USERNAME }}/camnect-project
            if [ ! -f .env.prod ]; then
              echo "[ERROR] .env.prod not found in camnect-project"
              exit 1
            fi
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            echo 'a988b4c1209582541db1df0bcc18c2c5fcf334440aa00dc21a9b83e02762f4b9  /etc/camnect/readers/camnect-v1.3.1.zip' | sudo sha256sum -c -
            sudo -E python3 .github/deploy/check-phone-deployment.py --compose docker-compose.prod.yml --check-network
            if command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              DC="docker compose"
            fi
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo env CAMNECT_SERVER_IMAGE="$CAMNECT_SERVER_IMAGE" $DC -f docker-compose.prod.yml pull
            worker_sha=$(sha256sum tag-suggestions/worker.py | cut -d' ' -f1)
            sudo env CAMNECT_SERVER_IMAGE="$CAMNECT_SERVER_IMAGE" CAMNECT_TAG_WORKER_SHA="$worker_sha" $DC -f docker-compose.prod.yml up -d --remove-orphans
            reader=$(sudo env CAMNECT_SERVER_IMAGE="$CAMNECT_SERVER_IMAGE" $DC -f docker-compose.prod.yml ps -q tag-reader)
            for attempt in $(seq 1 15); do
              if sudo docker exec "$reader" python -Ic "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/ready',timeout=2).close()"; then break; fi
              if [ "$attempt" = 15 ]; then exit 1; fi
              sleep 2
            done
            # The guest activity list reads MySQL even when the table is empty.
            for attempt in $(seq 1 60); do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 'http://127.0.0.1:8080/api/activity?size=1') || status=000
              if [ "$status" = 200 ]; then break; fi
              if [ "$attempt" = 60 ]; then
                echo "[ERROR] Application and database readiness check failed (HTTP $status)"
                exit 1
              fi
              sleep 2
            done
            sudo docker image prune -f

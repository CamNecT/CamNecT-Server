AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Konkuk job board crawler with signed automatic CamNeCT activity publication
Parameters:
  CamnectApiBaseUrl:
    Type: String
    Default: 'https://api.camnect.site'
    AllowedPattern: 'https://[^/]+/?'
    Description: CamNeCT HTTPS API origin.
  CamnectImportSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:ap-northeast-2:[0-9]{12}:secret:.+'
    Description: Existing Secrets Manager secret containing JSON sharedSecret (same as server configuration).
  ExpectedAccountId:
    Type: String
    Default: '117088935250'
    AllowedPattern: '[0-9]{12}'
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  ReservedConcurrency:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Use 1 only when the account has more than 10 concurrent executions; 0 uses the account pool.
Conditions:
  ReserveExecution: !Equals [!Ref ReservedConcurrency, 1]
Rules:
  CorrectAccount:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', !Ref ExpectedAccountId]
        AssertDescription: Deploy only to the intended new AWS account.
Resources:
  Archive:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRunLogs
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
  ArchivePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Archive
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Archive.Arn, !Sub '${Archive.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  State:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  Crawler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 600
      ReservedConcurrentExecutions: !If [ReserveExecution, 1, !Ref 'AWS::NoValue']
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          EXPECTED_ACCOUNT_ID: !Ref ExpectedAccountId
          STATE_TABLE: !Ref State
          ARCHIVE_BUCKET: !Ref Archive
          MAX_ARTICLES: '20'
          CAMNECT_API_BASE_URL: !Ref CamnectApiBaseUrl
          CAMNECT_IMPORT_SECRET_ARN: !Ref CamnectImportSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt State.Arn
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub '${Archive.Arn}/*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CamnectImportSecretArn
      Events:
        Poll:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(6 hours)
            State: !Ref ScheduleState
            FlexibleTimeWindow:
              Mode: 'OFF'
            RetryPolicy:
              MaximumRetryAttempts: 0
  CrawlerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Crawler}'
      RetentionInDays: 30
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Inspect crawler logs and archived run reports; source may have blocked requests.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Crawler
      Statistic: Sum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  FunctionName:
    Value: !Ref Crawler
  ArchiveBucket:
    Value: !Ref Archive
  StateTable:
    Value: !Ref State
